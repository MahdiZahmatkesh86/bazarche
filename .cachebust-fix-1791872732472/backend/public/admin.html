<style id="__category_card_circular__">
/* ============================================================
   Category Card — Circular thumb (final, inline)
   ============================================================ */

/* گرید */
.cat-grid-admin{
  display: grid !important;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important;
  gap: 16px !important;
}

/* کارت */
.cat-card-admin{
  background: #fff !important;
  border: 1px solid #e6e8ec !important;
  border-radius: 16px !important;
  overflow: hidden !important;
  display: flex !important;
  flex-direction: column !important;
  transition: all .25s ease !important;
}
.cat-card-admin:hover{
  box-shadow: 0 8px 20px -6px rgba(0,0,0,.1) !important;
  transform: translateY(-3px) !important;
  border-color: #d4d8de !important;
}

/* دایره — قلب موضوع */
.cat-grid-admin .cat-card-thumb{
  /* اندازه */
  width: 96px !important;
  height: 96px !important;
  min-width: 96px !important;
  min-height: 96px !important;
  max-width: 96px !important;
  max-height: 96px !important;

  /* شکل دایره */
  border-radius: 50% !important;
  aspect-ratio: 1 / 1 !important;

  /* وسط‌چین */
  margin: 20px auto 14px auto !important;
  display: grid !important;
  place-items: center !important;
  overflow: hidden !important;
  position: relative !important;

  /* ظاهر */
  border: 3px solid #fff !important;
  box-shadow:
    0 0 0 2px rgba(217, 42, 63, 0.22),
    0 6px 16px -6px rgba(0, 0, 0, 0.18) !important;

  /* پاک کردن استایل قدیمی */
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
  background-clip: padding-box !important;
  padding: 0 !important;
  font-size: 32px !important;
  line-height: 1 !important;

  transition: transform .25s ease !important;
}
.cat-card-admin:hover .cat-card-thumb{
  transform: scale(1.06) !important;
}

/* آیکون SVG داخل دایره */
.cat-grid-admin .cat-card-thumb svg{
  width: 38px !important;
  height: 38px !important;
  max-width: 38px !important;
  max-height: 38px !important;
}

/* والد دایره: پاک کردن هر ظاهری که مستطیل می‌ساخت */
.cat-card-admin > .cat-card-thumb-wrap{
  border-bottom: 0 !important;
  padding: 0 !important;
  background: transparent !important;
  aspect-ratio: auto !important;
}

/* اطلاعات */
.cat-card-info{
  padding: 4px 14px 14px 14px !important;
  text-align: center !important;
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  gap: 4px !important;
}
.cat-card-info b{
  font-size: 14px !important;
  font-weight: 800 !important;
  color: #0f172a !important;
}
.cat-card-info span{
  font-size: 11.5px !important;
  color: #64748b !important;
}

/* دکمه‌ها */
.cat-card-actions{
  display: flex !important;
  gap: 4px !important;
  padding: 10px 12px !important;
  background: #fafbfc !important;
  border-top: 1px solid #e6e8ec !important;
  justify-content: center !important;
}

/* موبایل */
@media (max-width: 640px){
  .cat-grid-admin{ grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  .cat-grid-admin .cat-card-thumb{
    width: 72px !important;
    height: 72px !important;
    min-width: 72px !important;
    min-height: 72px !important;
    max-width: 72px !important;
    max-height: 72px !important;
    margin: 14px auto 10px auto !important;
  }
  .cat-grid-admin .cat-card-thumb svg{
    width: 30px !important;
    height: 30px !important;
  }
  .cat-card-info{ padding: 4px 10px 10px 10px !important; }
  .cat-card-info b{ font-size: 12.5px !important; }
}
</style>
