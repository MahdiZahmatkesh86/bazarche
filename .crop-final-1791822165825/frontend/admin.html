<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل مدیریت | زحمتکش مارکت</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="admin-crop.css">
<link rel="stylesheet" href="admin-circular.css">
<link rel="stylesheet" href="gallery.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237b1e3a'/%3E%3C/svg%3E">
</head>
<body>

<div class="adm-boot" id="bootLoader">
  <div class="adm-boot-logo">
    <svg width="56" height="56" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9.5 12.5h13l-1.2 11H10.7z" fill="#fff"/><path d="M12.8 12.5c0-4.4 6.4-4.4 6.4 0" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
  <div class="adm-boot-spinner"></div>
  <p id="bootMsg">در حال بارگذاری...</p>
</div>

<div class="adm-app" id="app" hidden>
  <aside class="adm-side" id="sidebar">
    <div class="adm-brand">
      <div class="adm-brand-logo">
        <svg width="34" height="34" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9.5 12.5h13l-1.2 11H10.7z" fill="#fff"/><path d="M12.8 12.5c0-4.4 6.4-4.4 6.4 0" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="adm-brand-txt"><b>زحمتکش مارکت</b><span>پنل مدیریت</span></div>
    </div>
    <nav class="adm-nav" id="nav"></nav>
    <div class="adm-side-foot">
      <a href="index.html" target="_blank" rel="noopener" class="adm-view-site" id="viewSiteBtn"><span data-ic="external"></span><span>مشاهده سایت</span></a>
    </div>
  </aside>
  <div class="adm-side-scrim" id="sideScrim" hidden></div>
  <div class="adm-main">
    <header class="adm-top">
      <button class="adm-iconbtn adm-menubtn" id="menuBtn" type="button" aria-label="منو"><span data-ic="menu"></span></button>
      <div class="adm-crumb"><h1 id="pageTitle">داشبورد</h1><span class="adm-crumb-sub" id="pageSub"></span></div>
      <div class="adm-top-actions">
        <button class="adm-iconbtn adm-themebtn" id="themeBtn" type="button" aria-label="تغییر تم"><span class="adm-ic-sun" data-ic="sun"></span><span class="adm-ic-moon" data-ic="moon"></span></button>
        <button class="adm-iconbtn" id="refreshBtn" type="button" aria-label="به‌روزرسانی"><span data-ic="refresh"></span></button>
        <div class="adm-userchip" id="userChip" tabindex="0" role="button">
          <div class="adm-avatar" id="userAvatar">م</div>
          <div class="adm-user-meta"><b id="userName">—</b><span id="userEmail">—</span></div>
          <span class="adm-user-chip-arrow" data-ic="chevdown"></span>
          <div class="adm-usermenu" id="userMenu" hidden>
            <button class="adm-usermenu-it" data-user-menu="account"><span data-ic="user"></span>حساب من</button>
            <button class="adm-usermenu-it" data-user-menu="site"><span data-ic="external"></span>مشاهده سایت</button>
            <div class="adm-usermenu-sep"></div>
            <button class="adm-usermenu-it is-danger" data-user-menu="logout"><span data-ic="logout"></span>خروج از حساب</button>
          </div>
        </div>
      </div>
    </header>
    <main class="adm-content" id="content" tabindex="-1"></main>
  </div>
</div>

<div class="adm-toasts" id="toasts" role="status" aria-live="polite"></div>

<div class="adm-modal" id="modal" hidden>
  <div class="adm-modal-scrim" data-close></div>
  <div class="adm-modal-box" id="modalBox"></div>
</div>

<div class="adm-modal adm-confirm" id="confirmModal" hidden>
  <div class="adm-modal-scrim" data-confirm-close></div>
  <div class="adm-modal-box adm-confirm-box" id="confirmBox"></div>
</div>

<script src="config.js"></script>
<script src="admin-upload.js"></script>
<script src="purify.min.js"></script>
<script src="admin.js"></script>
<script src="admin-circular.js"></script>
<script src="admin-crop.js"></script>
<script src="gallery.js"></script>
<script src="lazy.js"></script>
</body>
</html>
