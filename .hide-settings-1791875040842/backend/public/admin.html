<style id="__cat_css_v6__">
#catGrid.cat-grid-admin{display:grid !important;grid-template-columns:repeat(auto-fill,minmax(180px,1fr)) !important;gap:16px !important}
#catGrid .cat-card-admin{background:#fff !important;border:1px solid #e6e8ec !important;border-radius:16px !important;overflow:hidden !important;display:flex !important;flex-direction:column !important;transition:all .25s ease !important}

#catGrid .cat-card-thumb{width:96px !important;height:96px !important;min-width:96px !important;min-height:96px !important;max-width:96px !important;max-height:96px !important;border-radius:50% !important;aspect-ratio:1/1 !important;margin:20px auto 14px auto !important;display:grid !important;place-items:center !important;overflow:hidden !important;position:relative !important;border:3px solid #fff !important;box-shadow:0 0 0 2px rgba(217,42,63,.22),0 6px 16px -6px rgba(0,0,0,.18) !important;background-color:#fafbfc !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important;padding:0 !important;font-size:32px !important;line-height:1 !important;transition:transform .25s ease !important}
#catGrid .cat-card-admin:hover .cat-card-thumb{transform:scale(1.06) !important}
#catGrid .cat-card-thumb svg{width:38px !important;height:38px !important;max-width:38px !important;max-height:38px !important}
#catGrid .cat-card-info{padding:4px 14px 14px 14px !important;text-align:center !important;display:flex !important;flex-direction:column !important;align-items:center !important;gap:4px !important}
#catGrid .cat-card-info b{font-size:14px !important;font-weight:800 !important;color:#0f172a !important}
#catGrid .cat-card-info span{font-size:11.5px !important;color:#64748b !important}
#catGrid .cat-card-actions{display:flex !important;gap:4px !important;padding:10px 12px !important;background:#fafbfc !important;border-top:1px solid #e6e8ec !important;justify-content:center !important}
@media (max-width:640px){#catGrid.cat-grid-admin{grid-template-columns:1fr 1fr !important;gap:10px !important}#catGrid .cat-card-thumb{width:72px !important;height:72px !important;min-width:72px !important;min-height:72px !important;max-width:72px !important;max-height:72px !important;margin:14px auto 10px auto !important}}
</style>

<script id="__cat_js_v6__">
(function(){
  'use strict';
  if(window.__CAT_V6__) return;
  window.__CAT_V6__ = true;

  console.log('[cat-v6] starting...');

  var categoriesCache = null;
  var lastFetch = 0;

  function fetchCategories(cb){
    var now = Date.now();
    if(categoriesCache && now - lastFetch < 3000){ return cb(categoriesCache); }
    var API = window.__API_BASE__ || window.__API_BASE || '/api';
    fetch(API + '/categories', { credentials: 'include' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        categoriesCache = (d && d.categories) || [];
        lastFetch = now;
        cb(categoriesCache);
      })
      .catch(function(e){
        console.warn('[cat-v6] fetch failed:', e.message);
        cb([]);
      });
  }

  function applyImages(){
    var thumbs = document.querySelectorAll('#catGrid .cat-card-thumb');
    if(!thumbs.length) return;

    fetchCategories(function(cats){
      if(!cats.length) return;

      /* نقشه‌ای از id → image_url */
      var map = {};
      cats.forEach(function(c){ map[c.id] = c.image_url || ''; });

      var applied = 0;
      for(var i = 0; i < thumbs.length; i++){
        var el = thumbs[i];
        var card = el.closest('.cat-card-admin');
        if(!card) continue;
        var id = Number(card.getAttribute('data-id'));
        if(!id) continue;
        var raw = map[id];
        if(!raw || !String(raw).trim()) continue;

        var full = window.__ASSET__ ? window.__ASSET__(raw) : raw;
        el.style.setProperty('background-image', 'url(' + JSON.stringify(full) + ')', 'important');
        el.style.setProperty('background-size', 'cover', 'important');
        el.style.setProperty('background-position', 'center', 'important');
        el.style.setProperty('background-repeat', 'no-repeat', 'important');
        el.style.setProperty('background-color', '#ffffff', 'important');
        /* آیکون SVG رو مخفی کن */
        var svg = el.querySelector('svg');
        if(svg) svg.style.display = 'none';
        el.setAttribute('data-has-img', '1');
        applied++;
      }

      if(applied) console.log('[cat-v6] applied images to', applied, 'thumbs');
    });
  }

  /* هر ۵۰۰ms چک کن */
  setInterval(applyImages, 500);

  /* MutationObserver روی body */
  var mo = new MutationObserver(function(){
    setTimeout(applyImages, 100);
    setTimeout(applyImages, 400);
  });
  mo.observe(document.body, { childList: true, subtree: true });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', applyImages);
  } else {
    applyImages();
  }

  console.log('[cat-v6] ready');
})();
</script>
<!-- /__CAT_FINAL_V6__ -->
